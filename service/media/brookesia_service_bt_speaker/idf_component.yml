version: "0.8.0"
description: ESP-Brookesia Bluetooth speaker media policy service.
url: https://github.com/espressif/esp-brookesia/tree/master/service/media/brookesia_service_bt_speaker
repository: https://github.com/espressif/esp-brookesia.git
issues: https://github.com/espressif/esp-brookesia/issues
dependencies:
  espressif/brookesia_service_helper:
    version: "0.8.*"
    override_path: ../../framework/brookesia_service_helper
    require: public
  espressif/brookesia_service_manager:
    version: "0.8.*"
    override_path: ../../framework/brookesia_service_manager
    require: public
  espressif/brookesia_service_bt:
    version: "0.8.*"
    override_path: ../../network/brookesia_service_bt
    require: private
