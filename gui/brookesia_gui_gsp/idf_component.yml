version: "0.8.0"
description: ESP-Brookesia GSP GUI session adapter for borrowed HAL display devices.
url: https://github.com/espressif/esp-brookesia/tree/master/gui/brookesia_gui_gsp
repository: https://github.com/espressif/esp-brookesia.git
issues: https://github.com/espressif/esp-brookesia/issues
dependencies:
  espressif/brookesia_lib_utils:
    version: "0.8.*"
    override_path: ../../utils/brookesia_lib_utils
    require: public

  espressif/brookesia_hal_interface:
    version: "0.8.*"
    override_path: ../../hal/brookesia_hal_interface
    require: public

  espressif/esp-gsp:
    version: "1.4.0"
    require: public

  espressif/zlib:
    version: "^1.3.0"
    require: private
