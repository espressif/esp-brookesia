.pre_check_template:
  stage: pre_check
  image: python:3.9
  tags: ["build", "amd64", "internet"]
  dependencies: []

check_pre_commit:
  extends:
    - .pre_check_template
  before_script:
    - pip install pre-commit
  script:
    - pre-commit run --show-diff-on-failure --color=always --all-files

check_readme_links:
  extends:
    - .pre_check_template
    - .rules:pre_check:readme
  allow_failure: true
  script:
    - python ${CI_PROJECT_DIR}/.gitlab/tools/check_readme_links.py

check_upload_components_tests:
  extends:
    - .pre_check_template
  before_script:
    - pip install PyYAML "flake8==5.0.4"
  script:
    - python .gitlab/tools/tests/test_check_upload_components.py -v
    - python -m flake8 --config=.flake8 .gitlab/tools/check_upload_components.py .gitlab/tools/tests/test_check_upload_components.py
    - |
      fail=0
      for f in .gitlab/tools/check_upload_components.py .gitlab/tools/tests/test_check_upload_components.py; do
        head -8 "$f" | grep -q "SPDX-License-Identifier: Apache-2.0" || { echo "missing SPDX header: $f"; fail=1; }
      done
      exit $fail
  rules:
    - changes:
        - .gitlab-ci.yml
        - .gitlab/ci/pre/check.yml
        - .gitlab/tools/check_upload_components.py
        - .gitlab/tools/tests/test_check_upload_components.py
        - .github/workflows/upload_component.yml

check_host_regressions:
  extends:
    - .pre_check_template
  image: ubuntu:24.04
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 g++-13 cmake make libboost-json-dev libboost-thread-dev zlib1g-dev
  variables:
    CXX: g++-13
  script:
    - python3 system/brookesia_system_core/host_test/test_host_event_shutdown.py
    - python3 system/brookesia_system_core/host_test/test_gsp_shell_lifecycle.py
    - python3 system/brookesia_system_core/host_test/test_gsp_failure_cleanup.py
    - python3 app/brookesia_app_settings/host_test/test_wifi_callback_lifetime.py
    - python3 app/brookesia_app_settings/host_test/test_sound_control.py
    - python3 app/brookesia_app_store/host_test/test_http_event_lifetime.py --sanitizer address
    - python3 hal/brookesia_hal_linux/host_test/test_connected_ssid.py
    - python3 service/media/brookesia_service_audio/test_apps/host/test_control_persistence.py
    - python3 gui/brookesia_gui_gsp/test_apps/host/session/test_desktop_session.py
    - cmake -S gui/brookesia_gui_gsp/test_apps/host/session -B build_host_gsp
    - cmake --build build_host_gsp -j2
    - ctest --test-dir build_host_gsp --output-on-failure
  rules:
    - changes:
        - .gitlab/ci/pre/check.yml
        - .gitlab-ci.yml
        - app/brookesia_app_settings/**/*
        - app/brookesia_app_store/**/*
        - gui/brookesia_gui_gsp/**/*
        - hal/brookesia_hal_linux/**/*
        - service/media/brookesia_service_audio/**/*
        - service/framework/brookesia_service_helper/**/*
        - system/brookesia_system_core/**/*
        - utils/brookesia_lib_utils/**/*
