# ESP-Mosaico v1.2 core-board peripherals
peripherals:
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 56
        scl: 3

  - name: i2c_expansion
    type: i2c
    role: master
    config:
      port: 1
      pins:
        sda: 0
        scl: 1

  - name: i2s_audio_out
    type: i2s
    role: master
    format: std-out
    config: &i2s_audio_config
      port: 0
      sample_rate_hz: 48000
      clk_src: I2S_CLK_SRC_DEFAULT
      mclk_multiple: 256
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_STEREO
      slot_mask: I2S_STD_SLOT_BOTH
      ws_width: 16
      pins:
        mclk: 54
        bclk: 37
        ws: 49
        dout: 52
        din: 40

  - name: i2s_audio_in
    type: i2s
    role: master
    format: std-in
    config: *i2s_audio_config

  - name: gpio_pa_control
    type: gpio
    role: io
    config:
      pin: 45
      mode: GPIO_MODE_OUTPUT
      default_level: 0

  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        data0_io_num: 36
        data1_io_num: 51
        data2_io_num: 35
        data3_io_num: 9
        sclk_io_num: 42
        max_transfer_sz: 460800

  - name: spi_nand
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI3_HOST
        mosi_io_num: 21
        miso_io_num: 22
        quadwp_io_num: -1
        quadhd_io_num: -1
        sclk_io_num: 20
        max_transfer_sz: 4096
